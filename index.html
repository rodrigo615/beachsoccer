<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz de futebol de areia</title><style>
:root{--bg:#f4f3ed;--ink:#202336;--muted:#666879;--accent:#5546d9;--lime:#d9f877;--line:#dfdfe7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 18px;font-weight:650;transition:background .15s,transform .15s}button:hover:not(:disabled){background:#eeebff;transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #998cff;outline-offset:3px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover:not(:disabled){background:#4032b8}.lime{background:var(--lime);border-color:var(--lime)}.ghost{background:transparent}.wrap{max-width:1120px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:36px}.brand{display:flex;align-items:center;gap:12px;font-weight:800}.logo{background:var(--accent);color:white;border-radius:13px;width:42px;height:42px;display:grid;place-items:center;font-size:25px}.tag{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--accent)}h1{font-size:clamp(32px,5vw,52px);line-height:1.12;letter-spacing:-1.8px;margin:12px 0 16px}h2{font-size:22px;margin:0 0 16px}p{margin:8px 0 20px}.muted,small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 8px 30px #20233604}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}label{display:block;font-weight:650;margin:14px 0 6px}textarea{width:100%;min-height:350px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafafd;font:14px/1.65 ui-monospace,monospace}select,input{padding:10px;border:1px solid var(--line);border-radius:9px;max-width:100%;background:white}#review{max-height:380px;overflow:auto;margin-top:18px}.reviewItem{border-top:1px solid var(--line);padding:14px 0;overflow-wrap:anywhere}.reviewItem p{margin:6px 0}.correctText{color:#17734d}.notice{padding:12px 14px;background:#f0eefb;border-radius:10px;font-size:14px;margin:14px 0;white-space:pre-line}.error{background:#fff0ed;color:#9c3425}.badge{padding:5px 12px;border-radius:99px;background:#eeebff;font-size:13px;font-weight:700}details{margin-top:18px}summary{cursor:pointer;font-weight:650}code{white-space:pre-wrap}.foot{font-size:13px;color:var(--muted);margin:22px 0}.game{max-width:820px;margin:auto}.hero{text-align:center;padding:32px 0 24px}.hero .symbol{font-size:44px;display:inline-grid;place-items:center;width:92px;height:92px;background:var(--lime);border-radius:25px;transform:rotate(-6deg)}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.players button{overflow-wrap:anywhere;text-align:left}.selected{background:#eeebff;border:2px solid var(--accent)}.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px;font-weight:700}.track{height:7px;border-radius:10px;background:#ecebf3;overflow:hidden;margin-bottom:25px}.fill{height:100%;background:var(--accent);width:100%}.question{font-size:clamp(23px,4vw,34px);font-weight:750;line-height:1.35;min-height:100px;white-space:pre-wrap;overflow-wrap:anywhere;margin:24px 0}.answers{display:grid;gap:12px}.answer{display:flex;align-items:center;gap:15px;text-align:left;padding:18px;font-size:18px;overflow-wrap:anywhere}.letter{display:grid;place-items:center;min-width:34px;height:34px;border-radius:9px;background:#f0eefb;font-size:14px}.answer.right{background:#e3f6e9;border-color:#419c60;opacity:1}.answer.wrong{background:#fff0ed;border-color:#d47565;opacity:1}#feedback{min-height:35px;font-weight:700;margin:14px 0}.bigscore{font-size:70px;font-weight:850;letter-spacing:-3px;color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{color:var(--muted)}[hidden]{display:none!important}.resultActions{justify-content:center;margin:20px 0}.counter{font-variant-numeric:tabular-nums}.wide{width:100%}@media(max-width:720px){.wrap{padding:18px}.grid{grid-template-columns:1fr}.card{padding:20px}header{margin-bottom:24px}.players{grid-template-columns:1fr 1fr}h1{letter-spacing:-1px}.answer{padding:14px}.stats{font-size:14px}.question{min-height:70px}}

.players{max-height:270px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#aaa2e8 #f1effa;padding:3px 8px 3px 3px;align-content:start}.players button{min-height:68px;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:12px;font-size:15px}.entryActions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.entryActions button{width:100%;min-height:50px}.setupRow{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:16px 0;margin-top:10px}.setupRow label{margin:0}.setupRow select{min-width:82px}.rankScroll{max-height:340px;overflow:auto}#home .hero{padding:12px 0 22px}#home .hero .symbol{width:64px;height:64px;font-size:32px}#home h1{font-size:clamp(30px,5vw,44px)}@media(max-width:420px){.entryActions{gap:8px}.entryActions button{padding:12px 8px;font-size:14px}.players{max-height:240px}.card{padding:18px}}
.classCredit{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.4}
.qrSection{margin-top:24px}.qrSection summary{font-size:20px}#qrCanvas{display:block;width:min(100%,300px);height:auto;margin:16px auto;background:white}#qrTarget{display:block;text-align:center;overflow-wrap:anywhere;font-size:13px;color:var(--accent)}
</style></head><body><div class="wrap"><header><div class="brand"><span class="logo">✳</span><span id="brandText">Futebol de areia — 7º ano</span></div></header><main id="game" class="game">
<div id="home"><div class="hero"><span class="symbol">⚽</span><h1 id="gameTitle"></h1></div>
<section class="card"><h2>Escolha seu nome</h2><div id="players" class="players"></div>
<div class="entryActions"><button id="guest" type="button">Convidado</button><button id="start" class="primary" disabled>Começar →</button><button id="retry" hidden>Reenviar pendente</button><button id="discardHome" hidden>Descartar pendente</button></div>
<p class="muted" style="font-size:13px;margin-top:10px">Convidado: joga para treinar, sem entrar no ranking.</p><p id="homeStatus" class="muted" role="status"></p></section>
<section class="card" style="margin-top:20px"><div class="row between"><h2>Melhores resultados</h2><button id="refreshRank" class="ghost">↻ Atualizar</button></div><div id="rank" class="rankScroll" role="status"></div></section></div>
<section id="play" class="card" hidden><div class="stats"><span id="progress"></span><span id="points"></span><span id="clock" class="counter"></span></div><div class="track"><div id="timerFill" class="fill"></div></div>
<small id="playerLabel"></small><div id="question" class="question" tabindex="-1"></div><div id="answers" class="answers"></div><div id="feedback" role="status"></div>
<div class="row between"><button id="quit" class="ghost">Sair</button><button id="next" class="primary" hidden>Próxima →</button></div></section>
<section id="result" class="card" hidden style="text-align:center"><div class="tag">Partida concluída</div><h1 id="resultName"></h1><div class="bigscore" id="finalPoints"></div><div id="finalStats"></div>
<p id="storageNote" class="muted" role="status"></p><div class="row resultActions"><button id="sendAgain" hidden>Reenviar resultado</button><button id="discardResult" hidden>Descartar pendente</button></div>
<div class="row resultActions"><button id="receipt">Baixar resultado</button><button id="backHome" class="primary">Início</button></div></section>
</main></div><script> 'use strict';
const $=id=>document.getElementById(id);
function call(endpoint,params){
  return new Promise((resolve,reject)=>{
    const cb='areia_'+Math.random().toString(36).slice(2);
    const tag=document.createElement('script');
    let done=false;
    const timeout=setTimeout(()=>end(new Error('Sem resposta do Apps Script. Verifique a implantação pública e a conexão.')),18000);
    function end(err,data){
      if(done)return;
      done=true;clearTimeout(timeout);delete window[cb];tag.remove();
      if(err)reject(err);
      else if(data && data.ok===true)resolve(data);
      else reject(new Error(data?.error||'Resposta inesperada do Apps Script.'));
    }
    window[cb]=data=>end(null,data);
    tag.onerror=()=>end(new Error('Não foi possível acessar o Apps Script. Confira a URL e o acesso público.'));
    const u=new URL(endpoint);
    Object.entries({...params,callback:cb,_:Date.now()}).forEach(([key,value])=>u.searchParams.set(key,value));
    tag.src=u.href;
    document.head.append(tag);
  });
}
function download(name,text,type='text/plain;charset=utf-8'){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

const cfg={"title":"Futebol de Areia — 7º ano","endpoint":"https://script.google.com/macros/s/AKfycbwF3HcyAeWf6KPRr1KEbcZzJixSZvfclV7jXCORxI01ALSfMqumf1E688rHgGLwf8zL/exec","game":"turma7a","names":["Ágatha","Angelo","Annalu","Camila","Claudio","Davi Lucas","Davi Willian","Dvison","Enzo","Everton","Francisco","Germana","Jardel","João Davi","João Gabriel","Júlio","Lívia","Luiz","Marciel","Maria Lucia","Maria Vitória Machado","Maria Vitória Rodrigues","Rebeca","Roberto","Samuel Damasceno","Samuel Sousa","Thácyla","Thaylla","Wendell","Wendson"]};
let name='',selectedName='',session=null,ticker=null,pending=null,sending=false,lastResult=null;
const pendingKey='areia-pending-v2:'+cfg.game+':'+new URL(cfg.endpoint).pathname;
const pointsFmt=n=>Number(n).toLocaleString('pt-BR')+' pts';
function show(page){['home','play','result'].forEach(id=>$(id).hidden=id!==page);}
function displayRank(rows){
 const el=$('rank');el.replaceChildren();
 if(!Array.isArray(rows)||rows.length===0){el.textContent='Nenhum resultado registrado.';return;}
 const table=document.createElement('table'),tr=document.createElement('tr');
 ['#','Aluno','Pontos','Acertos','Tempo'].forEach(x=>{const th=document.createElement('th');th.textContent=x;tr.append(th);});
 table.append(tr);
 rows.forEach((r,i)=>{
  const row=document.createElement('tr');
  [i+1,r.name,Number(r.points).toLocaleString('pt-BR'),r.hits+'/10',(Number(r.time)/1000).toFixed(1)+' s'].forEach(v=>{
   const td=document.createElement('td');td.textContent=v;row.append(td);
  });table.append(row);
 });el.append(table);
}
async function loadRank(){
 $('refreshRank').disabled=true;
 try{const result=await call(cfg.endpoint,{action:'rank',game:cfg.game});displayRank(result.rows);}
 catch(e){$('rank').textContent='Ranking online indisponível: '+e.message;}
 finally{$('refreshRank').disabled=false;}
}
function restore(){
 try{const data=JSON.parse(localStorage.getItem(pendingKey)||'null');pending=data&&data.id&&Array.isArray(data.answers)?data:null;}
 catch(_){pending=null;}
 updatePending();
}
function updatePending(){
 $('retry').hidden=!pending;
 $('discardHome').hidden=!pending;
 $('discardResult').hidden=!pending;
 if(pending)$('homeStatus').textContent='Existe um resultado ainda não confirmado. Reenvie ou descarte para iniciar outra partida.';
}
function discard(){
 if(!pending)return;
 if(!confirm('Descartar o resultado pendente deste navegador? Se o servidor já o recebeu, o registro continuará no ranking.'))return;
 try{localStorage.removeItem(pendingKey);}catch(_){/* armazenamento indisponível */}
 pending=null;lastResult=null;updatePending();show('home');
 $('homeStatus').textContent='Resultado pendente descartado neste navegador.';
}
function renderResult(){
 show('result');
 const data=pending||lastResult||{};
 $('resultName').textContent=data.name||name||'Resultado';
 $('finalPoints').textContent=Number.isFinite(data.points)?pointsFmt(data.points):'—';
 $('finalStats').textContent=Number.isInteger(data.hits)?data.hits+' acertos de 10':'';
 $('sendAgain').hidden=!pending;
 $('discardResult').hidden=!pending;
  if(data.guest)$('storageNote').textContent='Modo convidado: resultado não enviado e fora do ranking.';
  else if(pending)$('storageNote').textContent='Resultado ainda não confirmado pelo servidor.';
}
async function send(){
 if(!pending||sending)return;
 sending=true;const inFlight=pending;
 $('sendAgain').disabled=true;$('retry').disabled=true;$('discardResult').disabled=true;
 $('storageNote').textContent='Enviando resultado...';
 try{
  const result=await call(cfg.endpoint,{action:'finish',game:cfg.game,id:inFlight.id,answers:JSON.stringify(inFlight.answers)});
  lastResult={...inFlight,points:result.points,hits:result.hits,saved:true};
  $('storageNote').textContent='Resultado confirmado no ranking online.';
  $('finalPoints').textContent=pointsFmt(result.points);
  $('finalStats').textContent=result.hits+' acertos de 10';
  if(pending===inFlight){
   try{localStorage.removeItem(pendingKey);}catch(_){}
   pending=null;updatePending();
  }
  displayRank(result.rows);
 }catch(e){
  $('storageNote').textContent='Resultado ainda não confirmado: '+e.message;
 }finally{
  sending=false;$('sendAgain').disabled=false;$('retry').disabled=false;$('discardResult').disabled=false;
  $('sendAgain').hidden=!pending;$('discardResult').hidden=!pending;
 }
}
function decodeHint(q){
 const raw=atob(q.hint.replace(/-/g,'+').replace(/_/g,'/'));
 const parts=raw.split(':');
 if(parts.length!==2)throw Error('Gabarito recebido em formato inesperado.');
 const salt=Number(parts[0]),token=Number(parts[1]);
 const correct=(token-7)^(salt&3);
 if(!Number.isInteger(salt)||!Number.isInteger(token)||correct<0||correct>3)throw Error('Gabarito inválido.');
 return correct;
}
async function begin(guest=false){
 if(!guest&&!selectedName)return;
 if(pending){$('homeStatus').textContent='Reenvie ou descarte o resultado pendente antes de jogar novamente.';return;}
 name=guest?'Convidado':selectedName;
 $('start').disabled=true;$('guest').disabled=true;$('homeStatus').textContent='Sorteando dez questões...';
 try{
  const r=await call(cfg.endpoint,guest?{action:'guest',game:cfg.game}:{action:'start',game:cfg.game,name});
  if(!r.id||!Array.isArray(r.questions)||r.questions.length!==10||
     new Set(r.questions.map(q=>q.id)).size!==10||
     r.questions.some(q=>!q.prompt||!Array.isArray(q.answers)||q.answers.length!==4)){
   throw Error('O servidor não enviou dez questões válidas.');
  }
  r.questions.forEach(decodeHint);
  session={id:r.id,questions:r.questions,index:0,answers:[],points:0,hits:0,locked:false,guest};
  show('play');showQuestion();
 }catch(e){
  const detail=guest&&/Ação desconhecida/i.test(e.message)
   ? 'O Apps Script publicado ainda não reconhece Convidado. No Apps Script, use Implantar → Gerenciar implantações → Editar → Nova versão → Implantar.'
   : e.message;
  $('homeStatus').textContent='Não foi possível iniciar: '+detail;
 }
 finally{$('start').disabled=!selectedName;$('guest').disabled=false;}
}
function showQuestion(){
 clearInterval(ticker);
 const q=session.questions[session.index];
 session.locked=false;session.started=performance.now();
 $('progress').textContent=(session.index+1)+' / 10';
 $('points').textContent=pointsFmt(session.points);
 $('playerLabel').textContent=name;$('question').textContent=q.prompt;
 $('feedback').textContent='';$('next').hidden=true;
 const el=$('answers');el.replaceChildren();
 q.answers.forEach((answer,i)=>{
  const b=document.createElement('button');b.className='answer';
  const mark=document.createElement('span');mark.className='letter';mark.textContent='ABCD'[i];
  const text=document.createElement('span');text.textContent=answer;
  b.append(mark,text);b.onclick=()=>answerQuestion(i);el.append(b);
 });
 $('question').focus();ticker=setInterval(tick,80);tick();
}
function tick(){
 if(!session||session.locked)return;
 const left=Math.max(0,30000-(performance.now()-session.started));
 $('clock').textContent=(left/1000).toFixed(1)+' s';
 $('timerFill').style.width=(left/300)+'%';
 if(left<=0)answerQuestion(-1);
}
function answerQuestion(choice){
 if(!session||session.locked)return;
 const ms=Math.min(30000,Math.max(0,Math.round(performance.now()-session.started)));
 if(ms>=30000)choice=-1;
 session.locked=true;clearInterval(ticker);
 const q=session.questions[session.index],correct=decodeHint(q),hit=choice===correct;
 session.answers.push({id:q.id,choice,ms});
 if(hit){session.hits++;session.points+=1000+Math.floor(500*(1-ms/30000));}
 $('points').textContent=pointsFmt(session.points);
 $('clock').textContent=((30000-ms)/1000).toFixed(1)+' s';
 $('feedback').textContent=choice===-1?'Tempo esgotado.':hit?'Acertou!':'Resposta incorreta.';
 [...$('answers').children].forEach((btn,i)=>{
  btn.disabled=true;
  if(i===correct)btn.classList.add('right');
  else if(i===choice)btn.classList.add('wrong');
 });
 $('next').textContent=session.index===9?'Ver resultado →':'Próxima →';$('next').hidden=false;
}
function nextQuestion(){
 if(!session)return;
 session.index++;
 if(session.index<10){showQuestion();return;}
 if(session.guest){
  lastResult={name:'Convidado',points:session.points,hits:session.hits,guest:true,saved:false};
  renderResult();
  return;
 }
 pending={id:session.id,answers:session.answers,name,points:session.points,hits:session.hits,created:Date.now()};
 let savedLocally=true;
 try{localStorage.setItem(pendingKey,JSON.stringify(pending));}
 catch(_){savedLocally=false;}
 renderResult();
 if(!savedLocally)$('storageNote').textContent='Aviso: o navegador não permitiu guardar o envio. Não feche esta página até confirmar.';
 send();
}
function receipt(){
 const data=pending||lastResult;
 if(!data)return;
 const content=[cfg.title,'Aluno: '+(data.name||name),'Acertos: '+data.hits+'/10',
  'Pontuação informada: '+data.points,'Status: '+(data.guest?'Convidado: sem ranking':data.saved?'Confirmado pelo servidor':'Envio pendente'),
  'Comprovante informativo. Não substitui o registro do ranking online.'].join('\n');
 download('resultado_areia.txt',content);
}
$('brandText').textContent=cfg.title;$('gameTitle').textContent=cfg.title;
const playerBox=$('players');
cfg.names.forEach(n=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{selectedName=n;name=n;[...playerBox.children].forEach(x=>x.classList.toggle('selected',x===b));$('start').disabled=false;};
 playerBox.append(b);
});
$('start').onclick=()=>begin(false);
$('guest').onclick=()=>begin(true);
$('next').onclick=nextQuestion;
$('refreshRank').onclick=loadRank;
$('sendAgain').onclick=send;
$('retry').onclick=()=>{renderResult();send();};
$('discardHome').onclick=discard;$('discardResult').onclick=discard;
$('backHome').onclick=()=>{show('home');restore();loadRank();};
$('receipt').onclick=receipt;
$('quit').onclick=()=>{if(confirm('Sair da partida atual? As respostas desta partida serão perdidas.')){clearInterval(ticker);session=null;show('home');}};
document.addEventListener('keydown',e=>{
 if($('play').hidden||!session||session.locked||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
 const i='1234'.indexOf(e.key);
 if(i>=0)answerQuestion(i);
});
restore();loadRank();
</script></body></html>
