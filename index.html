<section class="card" style="margin-top:20px"><div class="row between"><h2>Melhores resultados</h2><button id="refreshRank" class="ghost">↻ Atualizar</button></div><div id="rank" class="rankScroll" role="status"></div><details class="bonusBox"><summary>Bônus na avaliação bimestral <span class="bonusMore">· até 1,5 ponto</span></summary><div class="bonusTiers"><div class="bonusTier"><span>1º</span><strong>+1,5</strong></div><div class="bonusTier"><span>2º</span><strong>+1,2</strong></div><div class="bonusTier"><span>3º</span><strong>+1,0</strong></div><div class="bonusTier"><span>4º–10º</span><strong>+0,7</strong></div><div class="bonusTier"><span>11º+</span><strong>+0,5</strong></div></div></details></section></div>

</main></div><script> 'use strict';
const $=id=>document.getElementById(id);
function call(endpoint,params){
  return new Promise((resolve,reject)=>{
    const cb='areia_'+Math.random().toString(36).slice(2);
    const tag=document.createElement('script');
    let done=false;
    const timeout=setTimeout(()=>end(new Error('A solicitação demorou mais que o esperado.')),18000);
    function end(err,data){
      if(done)return;
      done=true;clearTimeout(timeout);delete window[cb];tag.remove();
      if(err)reject(err);
      else if(data && data.ok===true)resolve(data);
      else reject(new Error(data?.error||'Não foi possível concluir a solicitação.'));
    }
    window[cb]=data=>end(null,data);
    tag.onerror=()=>end(new Error('Não foi possível concluir a solicitação.'));
    const u=new URL(endpoint);
    Object.entries({...params,callback:cb,_:Date.now()}).forEach(([key,value])=>u.searchParams.set(key,value));
    tag.src=u.href;
    document.head.append(tag);
  });
}
function download(name,text,type='text/plain;charset=utf-8'){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

const cfg={"title":"Futebol de Areia (7º ano A)","endpoint":"https://script.google.com/macros/s/AKfycbwF3HcyAeWf6KPRr1KEbcZzJixSZvfclV7jXCORxI01ALSfMqumf1E688rHgGLwf8zL/exec","game":"turma7a","names":["Ágatha","Angelo","Annalu","Camila","Claudio","Davi Lucas","Davi Willian","Dvison","Enzo","Everton","Francisco","Germana","Jardel","João Davi","João Gabriel","Júlio","Lívia","Luiz","Marciel","Maria Lucia","Maria Vitória Machado","Maria Vitória Rodrigues","Rebeca","Roberto","Samuel Damasceno","Samuel Sousa","Thácyla","Thaylla","Wendell","Wendson"]};
let name='',selectedName='',session=null,ticker=null,sending=false,lastResult=null;
const legacyPendingKey='areia-pending-v2:'+cfg.game+':'+new URL(cfg.endpoint).pathname;
const queueKey='areia-envios-v3:'+cfg.game+':'+new URL(cfg.endpoint).pathname;
let pendingQueue=[];
const pointsFmt=n=>Number(n).toLocaleString('pt-BR')+' pts';
function show(page){['home','play','result'].forEach(id=>$(id).hidden=id!==page);}
function displayRank(rows){
 const el=$('rank');el.replaceChildren();
 if(!Array.isArray(rows)||rows.length===0){el.textContent='Nenhum resultado registrado.';return;}
 const table=document.createElement('table'),tr=document.createElement('tr');
 ['#','Aluno','Pontos','Acertos','Tempo'].forEach(x=>{const th=document.createElement('th');th.textContent=x;tr.append(th);});
 table.append(tr);
 rows.forEach((r,i)=>{
  const row=document.createElement('tr');
  [i+1,r.name,Number(r.points).toLocaleString('pt-BR'),r.hits+'/10',(Number(r.time)/1000).toFixed(1)+' s'].forEach(v=>{
   const td=document.createElement('td');td.textContent=v;row.append(td);
  });table.append(row);
 });el.append(table);
}
// O ranking tenta novamente em caso de falha temporária de conexão.
// Uma falha de atualização não apaga uma classificação já carregada.
let rankLoading=false;
async function loadRank(){
 if(rankLoading)return;
 rankLoading=true;
 $('refreshRank').disabled=true;
 const rank=$('rank');
 const hasTable=()=>Boolean(rank.querySelector('table'));
 if(!hasTable())rank.textContent='Carregando ranking...';
 try{
  let result;
  try{
   result=await call(cfg.endpoint,{action:'rank',game:cfg.game});
  }catch(error){
   // Segunda tentativa somente para falha de conexão; sem mensagens técnicas na tela.
   if(navigator.onLine===false)throw error;
   result=await call(cfg.endpoint,{action:'rank',game:cfg.game});
  }
  if(!Array.isArray(result.rows))throw Error('Formato do ranking inválido.');
  displayRank(result.rows);
 }catch(_){
  if(!hasTable())rank.textContent='Não foi possível carregar o ranking.';
 }finally{
  rankLoading=false;
  $('refreshRank').disabled=false;
 }
}
// Envio silencioso e durável: os resultados não impedem novas partidas.
// O Apps Script trata múltiplos envios da mesma partida de forma idempotente.
function saveQueue(){
 try{
  if(pendingQueue.length)localStorage.setItem(queueKey,JSON.stringify(pendingQueue));
  else localStorage.removeItem(queueKey);
  return true;
 }catch(_){return false;}
}
function restore(){
 try{
  const loaded=JSON.parse(localStorage.getItem(queueKey)||'[]');
  pendingQueue=Array.isArray(loaded)?loaded.filter(x=>x&&x.id&&Array.isArray(x.answers)):[];
  // Aproveita eventual envio pendente do jogo anterior, sem ressuscitar a tela de resultado.
  const legacy=JSON.parse(localStorage.getItem(legacyPendingKey)||'null');
  if(legacy&&legacy.id&&Array.isArray(legacy.answers)&&!pendingQueue.some(x=>x.id===legacy.id)){
   pendingQueue.push(legacy);
  }
  if(saveQueue())localStorage.removeItem(legacyPendingKey);
 }catch(_){pendingQueue=[];}
 flushPending();
}
function renderResult(){
 show('result');
 const data=lastResult||{};
 $('resultName').textContent=data.name||name||'Resultado';
 $('finalPoints').textContent=Number.isFinite(data.points)?pointsFmt(data.points):'—';
 $('finalStats').textContent=Number.isInteger(data.hits)?data.hits+' acertos de 10':'';
 $('storageNote').textContent=data.guest?'Convidado: resultado fora do ranking.':data.saved?'Resultado registrado no ranking.':'Registrando resultado...';
}
async function flushPending(){
 if(sending||!pendingQueue.length)return;
 sending=true;
 // Tenta a partida mais recente primeiro; uma antiga com erro não atrasa os novos alunos.
 const batch=pendingQueue.slice().reverse();
 try{
  for(const job of batch){
   if(!pendingQueue.some(x=>x.id===job.id))continue;
   if(job.created&&Date.now()-job.created>24*60*60*1000){
    pendingQueue=pendingQueue.filter(x=>x.id!==job.id);saveQueue();continue;
   }
   try{
    const r=await call(cfg.endpoint,{action:'finish',game:cfg.game,id:job.id,answers:JSON.stringify(job.answers)});
    pendingQueue=pendingQueue.filter(x=>x.id!==job.id);saveQueue();
    if(lastResult&&lastResult.id===job.id){
     lastResult={...lastResult,points:r.points,hits:r.hits,saved:true};
     if(!$('result').hidden){
      $('finalPoints').textContent=pointsFmt(r.points);
      $('finalStats').textContent=r.hits+' acertos de 10';
      $('storageNote').textContent='Resultado registrado no ranking.';
     }
    }
    if(Array.isArray(r.rows))displayRank(r.rows);
   }catch(err){
    // Falha de rede não faz o resultado reaparecer na tela inicial.
    if(lastResult&&lastResult.id===job.id&&!$('result').hidden){
     $('storageNote').textContent='Resultado ainda não confirmado. Tentaremos enviá-lo novamente.';
    }
    // Segue para a próxima partida; o resultado antigo permanece na fila.
   }
  }
 }finally{
  sending=false;
  // Processa partidas que chegaram enquanto uma solicitação estava em andamento.
  if(pendingQueue.some(x=>!batch.some(y=>y.id===x.id)))flushPending();
 }
}
function decodeHint(q){
 const raw=atob(q.hint.replace(/-/g,'+').replace(/_/g,'/'));
 const parts=raw.split(':');
 if(parts.length!==2)throw Error('Gabarito recebido em formato inesperado.');
 const salt=Number(parts[0]),token=Number(parts[1]);
 const correct=(token-7)^(salt&3);
 if(!Number.isInteger(salt)||!Number.isInteger(token)||correct<0||correct>3)throw Error('Gabarito inválido.');
 return correct;
}
async function begin(guest=false){
 if(!guest&&!selectedName)return;
 name=guest?'Convidado':selectedName;
 lastResult=null;
 $('start').disabled=true;$('guest').disabled=true;$('homeStatus').textContent='Sorteando dez questões...';
 try{
  const r=await call(cfg.endpoint,guest?{action:'guest',game:cfg.game}:{action:'start',game:cfg.game,name});
  if(!r.id||!Array.isArray(r.questions)||r.questions.length!==10||
     new Set(r.questions.map(q=>q.id)).size!==10||
     r.questions.some(q=>!q.prompt||!Array.isArray(q.answers)||q.answers.length!==4)){
   throw Error('O servidor não enviou dez questões válidas.');
  }
  r.questions.forEach(decodeHint);
  session={id:r.id,questions:r.questions,index:0,answers:[],points:0,hits:0,locked:false,guest};
  $('homeStatus').textContent='';show('play');showQuestion();
 }catch(_){
  $('homeStatus').textContent='Não foi possível iniciar. Tente novamente.';
 }
 finally{$('start').disabled=!selectedName;$('guest').disabled=false;}
}
function showQuestion(){
 clearInterval(ticker);
 const q=session.questions[session.index];
 session.locked=false;session.started=performance.now();
 $('progress').textContent=(session.index+1)+' / 10';
 $('points').textContent=pointsFmt(session.points);
 $('playerLabel').textContent=name;$('question').textContent=q.prompt;
 $('question').classList.toggle('longQuestion',q.prompt.length>140);
 $('question').classList.toggle('veryLongQuestion',q.prompt.length>255);
 $('answers').classList.toggle('longAnswers',q.answers.some(a=>a.length>90));
 $('feedback').textContent='';$('next').hidden=true;
 const el=$('answers');el.replaceChildren();
 q.answers.forEach((answer,i)=>{
  const b=document.createElement('button');b.className='answer';
  const mark=document.createElement('span');mark.className='letter';mark.textContent='ABCD'[i];
  const text=document.createElement('span');text.textContent=answer;
  b.append(mark,text);b.onclick=()=>answerQuestion(i);el.append(b);
 });
 $('question').focus();ticker=setInterval(tick,80);tick();
}
function tick(){
 if(!session||session.locked)return;
 const left=Math.max(0,30000-(performance.now()-session.started));
 $('clock').textContent=(left/1000).toFixed(1)+' s';
 $('timerFill').style.width=(left/300)+'%';
 if(left<=0)answerQuestion(-1);
}
function answerQuestion(choice){
 if(!session||session.locked)return;
 const ms=Math.min(30000,Math.max(0,Math.round(performance.now()-session.started)));
 if(ms>=30000)choice=-1;
 session.locked=true;clearInterval(ticker);
 const q=session.questions[session.index],correct=decodeHint(q),hit=choice===correct;
 session.answers.push({id:q.id,choice,ms});
 if(hit){session.hits++;session.points+=1000+Math.floor(500*(1-ms/30000));}
 $('points').textContent=pointsFmt(session.points);
 $('clock').textContent=((30000-ms)/1000).toFixed(1)+' s';
 $('feedback').textContent=choice===-1?'Tempo esgotado.':hit?'Acertou!':'Resposta incorreta.';
 [...$('answers').children].forEach((btn,i)=>{
  btn.disabled=true;
  if(i===correct)btn.classList.add('right');
  else if(i===choice)btn.classList.add('wrong');
 });
 $('next').textContent=session.index===9?'Ver resultado →':'Próxima →';$('next').hidden=false;
}
function nextQuestion(){
 if(!session)return;
 session.index++;
 if(session.index<10){showQuestion();return;}
 if(session.guest){
  lastResult={id:'guest',name:'Convidado',points:session.points,hits:session.hits,guest:true,saved:false};
  renderResult();
  session=null;
  return;
 }
 const job={id:session.id,answers:session.answers,name,points:session.points,hits:session.hits,created:Date.now()};
 lastResult={...job,saved:false};
 pendingQueue.push(job);
 const persisted=saveQueue();
 renderResult();
 if(!persisted)$('storageNote').textContent='Registrando resultado... Mantenha esta página aberta até confirmar.';
 session=null;
 flushPending();
}
function receipt(){
 const data=lastResult;
 if(!data)return;
 const content=[cfg.title,'Aluno: '+(data.name||name),'Acertos: '+data.hits+'/10',
  'Pontos: '+data.points,'Registro: '+(data.guest?'Convidado':data.saved?'Confirmado':'Pendente')].join('\n');
 download('resultado_areia.txt',content);
}
$('brandText').textContent=cfg.title;$('gameTitle').textContent=cfg.title;
const playerBox=$('players');
cfg.names.forEach(n=>{
 const b=document.createElement('button');b.textContent=n;
 b.onclick=()=>{selectedName=n;name=n;[...playerBox.children].forEach(x=>x.classList.toggle('selected',x===b));$('start').disabled=false;};
 playerBox.append(b);
});
$('start').onclick=()=>begin(false);
$('guest').onclick=()=>begin(true);
$('next').onclick=nextQuestion;
$('refreshRank').onclick=loadRank;
$('backHome').onclick=()=>{show('home');$('homeStatus').textContent='';flushPending();loadRank();};
$('receipt').onclick=receipt;
$('quit').onclick=()=>{if(confirm('Sair da partida atual? As respostas desta partida serão perdidas.')){clearInterval(ticker);session=null;show('home');$('homeStatus').textContent='';}};
document.addEventListener('keydown',e=>{
 if($('play').hidden||!session||session.locked||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;
 const i='1234'.indexOf(e.key);
 if(i>=0)answerQuestion(i);
